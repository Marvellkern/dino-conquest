<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121418" />
    <title>Dino-Conquest</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27 shape-rendering=%27crispEdges%27%3E%3Crect width=%278%27 height=%278%27 fill=%27%2322262e%27/%3E%3Crect x=%271%27 y=%272%27 width=%276%27 height=%274%27 fill=%27%235ca048%27/%3E%3Crect x=%275%27 y=%273%27 width=%271%27 height=%271%27 fill=%27%23c8281e%27/%3E%3Crect x=%272%27 y=%276%27 width=%271%27 height=%271%27 fill=%27%233a6e34%27/%3E%3Crect x=%275%27 y=%276%27 width=%271%27 height=%271%27 fill=%27%233a6e34%27/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #121418; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
      #rotate {
        display: none; position: fixed; left: 0; right: 0; bottom: 12%; text-align: center; pointer-events: none;
        color: #8a90a0; font: 12px/1.6 ui-monospace, monospace; letter-spacing: 2px; text-transform: uppercase;
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Turn your phone sideways<br />for a bigger view</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
